[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneshifter"
version = "0.1.0"
description = "Training-free multi-scene temporal control for DiT video backbones"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "torch>=2.1",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["sceneshifter*"]
